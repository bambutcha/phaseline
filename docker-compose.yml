services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phaseline
      POSTGRES_PASSWORD: phaseline
      POSTGRES_DB: phaseline
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phaseline"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgres://phaseline:phaseline@postgres:5432/phaseline?sslmode=disable
      PORT: "8080"
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_BASE: ""
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - web
      - api

volumes:
  pgdata:
