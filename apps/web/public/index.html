<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PHASELINE</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0f14;
        --gold: #c9a227;
        --cold: #2e86ab;
        --fg: #e8e8e8;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: ui-sans-serif, system-ui, sans-serif;
        background: radial-gradient(1200px 600px at 50% -10%, #1a2430 0%, var(--bg) 55%);
        color: var(--fg);
      }
      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 3rem 1.25rem;
      }
      h1 {
        letter-spacing: 0.28em;
        font-weight: 600;
        font-size: 1.4rem;
        color: var(--gold);
      }
      p {
        line-height: 1.55;
        color: #c5c9ce;
      }
      code {
        color: var(--cold);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>PHASELINE</h1>
      <p>Deliver before the line.</p>
      <p>
        Каркас репозитория готов. Игра ещё не собрана — это заглушка до
        <code>docs/DEVELOPMENT.md</code>, фаза 0–4.
      </p>
      <p>API: <code>/health</code></p>
    </main>
  </body>
</html>
